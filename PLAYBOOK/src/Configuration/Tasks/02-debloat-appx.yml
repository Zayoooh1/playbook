---
title: Total Debloat - AppX, Store, Xbox, Game Bar, Copilot, Recall, OneDrive
description: Usuwa zbedne pakiety AppX na podstawie jawnej listy, blokuje ich przywracanie (Deprovisioned), usuwa Store, Xbox, Copilot, Recall, Widgets, Teams, Cortana i OneDrive.
privilege: TrustedInstaller
actions:
  # ============================================================================
  # JAWNA WHITELISTA ZACHOWYWANYCH KOMPONENTOW SYSTEMOWYCH (NIE SA USUWANE):
  # - Microsoft.VCLibs.*                     (biblioteki C++ dla aplikacji i UI)
  # - Microsoft.UI.Xaml.*                    (silnik WinUI / Ustawienia)
  # - Microsoft.WindowsAppRuntime.*          (Windows App SDK)
  # - Microsoft.NET.Native.*                 (runtime UWP/XAML)
  # - Microsoft.Services.Store.Engagement    (zaleznosci komponentow UI)
  # - Microsoft.AIFabric.CBS.*               (KRYTYCZNE na Win 11 26H2 build 26300 - usuniecie psuje OpenWith.exe!)
  # - ShellExperienceHost / StartMenuExperienceHost / Client.CBS / Windows.Search / ImmersiveControlPanel
  # - Kodeki systemowe oraz panele sterownikow OEM (NVIDIA, Intel, Realtek, AMD)
  # - Microsoft Edge WebView2 Runtime        (wymagane przez Roblox i komponenty powloki Windows)
  # ============================================================================

  # --- Zamkniecie procesow przed debloatem ---
  - !taskKill: {name: 'GameBar', errorAction: Ignore}
  - !taskKill: {name: 'GameBarFTServer', errorAction: Ignore}
  - !taskKill: {name: 'XboxPcApp', errorAction: Ignore}
  - !taskKill: {name: 'XboxAppServices', errorAction: Ignore}
  - !taskKill: {name: 'Widgets', errorAction: Ignore}
  - !taskKill: {name: 'WidgetService', errorAction: Ignore}
  - !taskKill: {name: 'ms-teams', errorAction: Ignore}
  - !taskKill: {name: 'Teams', errorAction: Ignore}
  - !taskKill: {name: 'PhoneExperienceHost', errorAction: Ignore}
  - !taskKill: {name: 'WinStore.App', errorAction: Ignore}

  # ============================================================================
  # 1. MICROSOFT STORE
  # ============================================================================
  - !appx: {name: 'Microsoft.WindowsStore*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.StorePurchaseApp*', operation: remove, type: family, errorAction: Ignore}

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsStore'
      value: 'AutoDownload'
      type: REG_DWORD
      data: 4
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsStore'
      value: 'RemoveWindowsStore'
      type: REG_DWORD
      data: 1

  # ============================================================================
  # 2. EKOSYSTEM XBOX + GAME BAR + GAMING COPILOT + FIX ms-gamingoverlay
  # ============================================================================
  - !appx: {name: 'Microsoft.XboxApp*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.XboxGamingOverlay*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.XboxGameOverlay*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.XboxIdentityProvider*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.GamingServices*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.XboxSpeechToTextOverlay*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.Xbox.TCUI*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.GamingApp*', operation: remove, type: family, errorAction: Ignore}

  # Wylaczenie uslug Xbox i GamingServices
  - !service: {name: 'XblAuthManager', operation: stop, errorAction: Ignore}
  - !service: {name: 'XblAuthManager', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'XblGameSave', operation: stop, errorAction: Ignore}
  - !service: {name: 'XblGameSave', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'XboxNetApiSvc', operation: stop, errorAction: Ignore}
  - !service: {name: 'XboxNetApiSvc', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'XboxGipSvc', operation: stop, errorAction: Ignore}
  - !service: {name: 'XboxGipSvc', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'GamingServices', operation: stop, errorAction: Ignore}
  - !service: {name: 'GamingServices', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'GamingServicesNet', operation: stop, errorAction: Ignore}
  - !service: {name: 'GamingServicesNet', operation: change, startup: 4, errorAction: Ignore}

  # Wylaczenie Game DVR, Game Bar i Gaming Copilot
  - !registryValue:
      path: 'HKCU\System\GameConfigStore'
      value: 'GameDVR_Enabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
      value: 'AppCaptureEnabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\GameBar'
      value: 'ShowStartupPanel'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\GameBar'
      value: 'UseNexusForGameBarEnabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\GameBar'
      value: 'GamePanelStartupTipIndex'
      type: REG_DWORD
      data: 3
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
      value: 'AllowGameDVR'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\default\ApplicationManagement\AllowGameDVR'
      value: 'value'
      type: REG_DWORD
      data: 0
      errorAction: Ignore
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\WindowsRuntime\ActivatableClassId\Windows.Gaming.GameBar.PresenceServer.Internal.PresenceWriter'
      value: 'ActivationType'
      type: REG_DWORD
      data: 0
      errorAction: Ignore
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\WindowsRuntime\ActivatableClassId\Microsoft.Xbox.GamingAI.Companion.Host.GamingCompanionHostOptions'
      value: 'ActivationType'
      type: REG_DWORD
      data: 0
      errorAction: Ignore

  # Obowiazkowy fix na popup "You'll need a new app to open this ms-gamingoverlay link"
  - !registryValue:
      path: 'HKCR\ms-gamingoverlay'
      value: ''
      type: REG_SZ
      data: 'URL:ms-gamingoverlay'
  - !registryValue:
      path: 'HKCR\ms-gamingoverlay'
      value: 'URL Protocol'
      type: REG_SZ
      data: ''
  - !registryValue:
      path: 'HKCR\ms-gamingoverlay\shell\open\command'
      value: ''
      type: REG_SZ
      data: '%SystemRoot%\System32\systray.exe'

  - !registryValue:
      path: 'HKCR\ms-gamebar'
      value: ''
      type: REG_SZ
      data: 'URL:ms-gamebar'
  - !registryValue:
      path: 'HKCR\ms-gamebar'
      value: 'URL Protocol'
      type: REG_SZ
      data: ''
  - !registryValue:
      path: 'HKCR\ms-gamebar\shell\open\command'
      value: ''
      type: REG_SZ
      data: '%SystemRoot%\System32\systray.exe'

  # ============================================================================
  # 3. COPILOT I RECALL (WINDOWS 11 - Z ZACHOWANIEM Microsoft.AIFabric.CBS.*)
  # ============================================================================
  - !appx: {name: 'Microsoft.Copilot*', operation: remove, type: family, builds: ['>=22000'], errorAction: Ignore}
  - !appx: {name: 'Microsoft.Windows.Ai.Copilot.Provider*', operation: remove, type: family, builds: ['>=22000'], errorAction: Ignore}

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'RemoveMicrosoftCopilotApp'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'DisableAIDataAnalysis'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'AllowRecallEnablement'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'TurnOffWindowsCopilot'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot'
      value: 'TurnOffWindowsCopilot'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Policies\Microsoft\Windows\WindowsCopilot'
      value: 'TurnOffWindowsCopilot'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']

  - !cmd:
      command: 'DISM /Online /Disable-Feature /FeatureName:Recall /NoRestart'
      wait: true
      builds: ['>=22000']
      errorAction: Ignore

  # ============================================================================
  # 4. WIDGETS, TEAMS, CORTANA, SPOTIFY STORE I ZBEDNE PAKIETY APPX
  # ============================================================================
  - !appx: {name: 'MicrosoftWindows.Client.WebExperience*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'Microsoft.WidgetsPlatformRuntime*', operation: remove, type: family, errorAction: Ignore}
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Dsh'
      value: 'AllowNewsAndInterests'
      type: REG_DWORD
      data: 0

  - !appx: {name: 'MicrosoftTeams*', operation: remove, type: family, errorAction: Ignore}
  - !appx: {name: 'MSTeams*', operation: remove, type: family, errorAction: Ignore}
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Communications'
      value: 'ConfigureChatAutoInstall'
      type: REG_DWORD
      data: 0

  - !appx: {name: 'Microsoft.549981C3F5F10*', operation: remove, type: family, errorAction: Ignore}

  # Usuniecie wersji Spotify ze Store (inaczej instalator desktop Spotify wisi)
  - !appx: {name: 'SpotifyAB.SpotifyMusic*', operation: remove, type: family, errorAction: Ignore}

  # Jawna lista usuwanych aplikacji bloatware (BEZ slepego Remove-AppxPackage)
