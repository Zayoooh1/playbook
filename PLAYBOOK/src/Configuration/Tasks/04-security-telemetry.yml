---
title: Security, Windows Defender, SmartScreen and Telemetry
description: Wylacza Windows Defender, Security Center, SmartScreen, Smart App Control, telemetrie, WER oraz dodaje blokady IFEO i jednorazowy skrypt post-boot dla MDCoreSvc.
privilege: TrustedInstaller
actions:
  # ============================================================================
  # 1. WINDOWS DEFENDER - POLITYKI I USLUGI
  # ============================================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender'
      value: 'DisableAntiSpyware'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender'
      value: 'DisableAntiVirus'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender'
      value: 'DisableRealtimeMonitoring'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender'
      value: 'ServiceKeepAlive'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
      value: 'DisableRealtimeMonitoring'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
      value: 'DisableBehaviorMonitoring'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
      value: 'DisableOnAccessProtection'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
      value: 'DisableScanOnRealtimeEnable'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
      value: 'SpynetReporting'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
      value: 'SubmitSamplesConsent'
      type: REG_DWORD
      data: 2
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
      value: 'DontReportInfectionInformation'
      type: REG_DWORD
      data: 1

  # Wylaczenie uslug Defendera i Security Center
  - !service: {name: 'WinDefend', operation: stop, errorAction: Ignore}
  - !service: {name: 'WinDefend', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'WdNisSvc', operation: stop, errorAction: Ignore}
  - !service: {name: 'WdNisSvc', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'WdNisDrv', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'WdFilter', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'WdBoot', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'Sense', operation: stop, errorAction: Ignore}
  - !service: {name: 'Sense', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'SecurityHealthService', operation: stop, errorAction: Ignore}
  - !service: {name: 'SecurityHealthService', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'wscsvc', operation: stop, errorAction: Ignore}
  - !service: {name: 'wscsvc', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'MDCoreSvc', operation: stop, errorAction: Ignore}
  - !service: {name: 'MDCoreSvc', operation: change, startup: 4, errorAction: Ignore}

  # Bezposrednie wpisy Start = 4 w rejestrze (na wypadek blokady SCM)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\WinDefend', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\WdNisSvc', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\WdNisDrv', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\WdFilter', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\WdBoot', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\Sense', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\SecurityHealthService', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\wscsvc', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\MDCoreSvc', value: 'Start', type: REG_DWORD, data: 4, errorAction: Ignore}

  # Jednorazowe zadanie post-boot wylaczajace MDCoreSvc po pierwszym restarcie (wzorzec AtlasOS)
  - !powerShell:
      command: '.\disable-defender-postboot.ps1'
      exeDir: true
      runas: trustedInstaller
      wait: true
      timeout: 120000
      errorAction: Log

  # Ukrycie ikony SecurityHealth w zasobniku i usuniecie z autostartu
  - !taskKill: {name: 'SecurityHealthSystray', errorAction: Ignore}
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
      value: 'SecurityHealth'
      operation: delete
      errorAction: Ignore
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\Systray'
      value: 'HideSystray'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\Notifications'
      value: 'DisableNotifications'
      type: REG_DWORD
      data: 1

  # Wylaczenie zaplanowanych zadan Defendera
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Defender\Windows Defender Cache Maintenance', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Defender\Windows Defender Cleanup', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Defender\Windows Defender Scheduled Scan', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Defender\Windows Defender Verification', operation: disable, errorAction: Ignore}

  # ============================================================================
  # 2. SMARTSCREEN I SMART APP CONTROL
  # ============================================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
      value: 'EnableSmartScreen'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer'
      value: 'SmartScreenEnabled'
      type: REG_SZ
      data: 'Off'
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\AppHost'
      value: 'EnableWebContentEvaluation'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\SmartScreen'
      value: 'ConfigureAppInstallControl'
      type: REG_SZ
      data: 'Anywhere'
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\SmartScreen'
      value: 'ConfigureAppInstallControlEnabled'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy'
      value: 'VerifiedAndReputablePolicyState'
      type: REG_DWORD
      data: 0
      errorAction: Ignore

  # ============================================================================
  # 3. TELEMETRIA, WER, USLUGI DIAGNOSTYCZNE, HARMONOGRAM I IFEO
  # ============================================================================
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      value: 'AllowTelemetry'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      value: 'DoNotShowFeedbackNotifications'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection'
      value: 'AllowTelemetry'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\default\System\AllowTelemetry'
      value: 'value'
      type: REG_DWORD
      data: 0
      errorAction: Ignore

  # Windows Error Reporting (WER)
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
      value: 'Disabled'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
      value: 'DontShowUI'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
      value: 'LoggingDisabled'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
      value: 'Disabled'
      type: REG_DWORD
      data: 1

  # Uslugi telemetrii i diagnostyki
  - !service: {name: 'DiagTrack', operation: stop, errorAction: Ignore}
  - !service: {name: 'DiagTrack', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'dmwappushservice', operation: stop, errorAction: Ignore}
  - !service: {name: 'dmwappushservice', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'WerSvc', operation: stop, errorAction: Ignore}
  - !service: {name: 'WerSvc', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'diagnosticshub.standardcollector.service', operation: stop, errorAction: Ignore}
  - !service: {name: 'diagnosticshub.standardcollector.service', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'WdiServiceHost', operation: stop, errorAction: Ignore}
  - !service: {name: 'WdiServiceHost', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'WdiSystemHost', operation: stop, errorAction: Ignore}
  - !service: {name: 'WdiSystemHost', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'PcaSvc', operation: stop, errorAction: Ignore}
  - !service: {name: 'PcaSvc', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'wisvc', operation: stop, errorAction: Ignore}
  - !service: {name: 'wisvc', operation: change, startup: 4, errorAction: Ignore}

  # Harmonogram zadan telemetrii
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\ProgramDataUpdater', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\StartupAppTask', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\PcaPatchDbTask', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\KernelCeipTask', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Autochk\Proxy', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Feedback\Siuf\DmClient', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload', operation: disable, errorAction: Ignore}
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Error Reporting\QueueReporting', operation: disable, errorAction: Ignore}

  # IFEO blokada wykonywania telemetrii (wzorzec ReviOS)
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\CompatTelRunner.exe'
      value: 'Debugger'
      type: REG_SZ
      data: '%windir%\System32\taskkill.exe'
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\DeviceCensus.exe'
      value: 'Debugger'
      type: REG_SZ
      data: '%windir%\System32\taskkill.exe'
