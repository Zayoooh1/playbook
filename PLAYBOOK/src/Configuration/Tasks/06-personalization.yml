---
title: Personalization (Windows 10 and Windows 11)
description: Konfiguruje tapete (Fill), tryb Dark, brak przezroczystosci, ekran blokady bez Spotlight, Menu Start oraz Pasek zadan z podzialem na Windows 10 i Windows 11.
privilege: TrustedInstaller
actions:
  # ============================================================================
  # 1. BACKGROUND & COLORS (WSPOLNE WIN 10 / WIN 11)
  # ============================================================================
  - !registryValue:
      path: 'HKCU\Control Panel\Desktop'
      value: 'WallpaperStyle'
      type: REG_SZ
      data: '10'
  - !registryValue:
      path: 'HKCU\Control Panel\Desktop'
      value: 'TileWallpaper'
      type: REG_SZ
      data: '0'
  - !registryValue:
      path: 'HKCU\Control Panel\Desktop'
      value: 'AutoColorization'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'AppsUseLightTheme'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'SystemUsesLightTheme'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'EnableTransparency'
      type: REG_DWORD
      data: 0

  # ============================================================================
  # 2. LOCK SCREEN (PICTURE, BEZ SPOTLIGHT/PORAD, TLO NA EKRANIE LOGOWANIA ON)
  # ============================================================================
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'RotatingLockScreenEnabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'RotatingLockScreenOverlayEnabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-338387Enabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      value: 'DisableWindowsSpotlightFeatures'
      type: REG_DWORD
      data: 1
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
      value: 'DisableLogonBackgroundImage'
      type: REG_DWORD
      data: 0

  # ============================================================================
  # 3. MENU START (WSPOLNE + SPECYFICZNE DLA WIN 11)
  # ============================================================================
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_TrackProgs'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_TrackDocs'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_ShowRecentDocs'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_AccountNotifications'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SystemPaneSuggestionsEnabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-338388Enabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-338389Enabled'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Start'
      value: 'ShowMoreTiles'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      value: 'NoStartMenuMorePrograms'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\StartPage'
      value: 'MakeAllAppsDefault'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer'
      value: 'ShowRecent'
      type: REG_DWORD
      data: 0
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer'
      value: 'ShowFrequent'
      type: REG_DWORD
      data: 0

  # Dodatkowe ustawienia Menu Start - Windows 11 (24H2 / 25H2 / 26H2 / 27H2+)
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_IrisRecommendations'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_Layout'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      value: 'HideRecommendedSection'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']

  # ============================================================================
  # 4. PASEK ZADAN - WINDOWS 10 (<22000)
  # ============================================================================
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarSizeMove'
      type: REG_DWORD
      data: 0
      builds: ['<22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarSmallIcons'
      type: REG_DWORD
      data: 0
      builds: ['<22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'DisablePreviewDesktop'
      type: REG_DWORD
      data: 1
      builds: ['<22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'DontUsePowerShellOnWinX'
      type: REG_DWORD
      data: 0
      builds: ['<22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarBadges'
      type: REG_DWORD
      data: 1
      builds: ['<22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarGlomLevel'
      type: REG_DWORD
      data: 0
      builds: ['<22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Search'
      value: 'SearchboxTaskbarMode'
      type: REG_DWORD
      data: 0
      builds: ['<22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'ShowTaskViewButton'
      type: REG_DWORD
      data: 0
      builds: ['<22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Feeds'
      value: 'ShellFeedsTaskbarViewMode'
      type: REG_DWORD
      data: 2
      builds: ['<22000']

  # ============================================================================
  # 5. PASEK ZADAN - WINDOWS 11 (>=22000)
  # ============================================================================
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarDa'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarMn'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'ShowTaskViewButton'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Search'
      value: 'SearchboxTaskbarMode'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'ShowCopilotButton'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarGlomLevel'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarBadges'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'DontUsePowerShellOnWinX'
      type: REG_DWORD
      data: 0
      builds: ['>=22000']
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'DisablePreviewDesktop'
      type: REG_DWORD
      data: 1
      builds: ['>=22000']
