<?xml version="1.0" encoding="utf-8"?>
<Playbook>
  <Name>Custom Gaming &amp; Privacy Playbook</Name>
  <Username>CustomPlaybook</Username>
  <ShortDescription>Totalny debloat, prywatnosc (kamera/mikrofon ON), DNS Cloudflare, twarda blokada WU i optymalizacja FPS.</ShortDescription>
  <Title>Custom Playbook (Win 10 22H2 / Win 11 26H2+)</Title>
  <Description>Kompletny, modularny playbook AME Wizard dla Windows 10 22H2 oraz Windows 11 26H2 (z gotowoscia pod 27H2). Usuwa bloatware, Microsoft Store, Xbox/Game Bar, Copilot, Recall, Edge (z zachowaniem WebView2 Runtime) i OneDrive, konfiguruje jezyk pl-PL, DNS Cloudflare (+ DoH na Win 11), prywatnosc z wyjatkiem kamery i mikrofonu, realne tweaki wydajnosciowe, opcjonalne aplikacje bez Store/winget oraz trwala blokade Windows Update.</Description>
  <Details>Przeznaczony wylacznie na swieze instalacje Windows 10 22H2 Pro (x64) oraz Windows 11 24H2-26H2+ Pro (x64). Wymaga wylaczenia wszystkich 4 przelacznikow w Windows Security (w tym Tamper Protection) przed uruchomieniem.</Details>
  <Version>1.0.0</Version>
  <UniqueId>7de4e6e8-ce8f-422a-8f5c-fec03a93cb7a</UniqueId>
  <EstimatedMinutes>15</EstimatedMinutes>
  <ProgressText>Konfigurowanie systemu Windows, usuwanie bloatware i optymalizacja...</ProgressText>
  <Overhaul>true</Overhaul>
  <SupportedBuilds>
    <!-- Windows 10 22H2 (GA) -->
    <string>19045</string>
    <!-- Windows 11 24H2 (GA - dla wygody testow na VM) -->
    <string>26100</string>
    <!-- Windows 11 25H2 (GA - dla wygody testow na VM) -->
    <string>26200</string>
    <!-- Windows 11 26H2 (GA) -->
    <string>26300</string>
    <!--
      GOTOWOSC POD WINDOWS 11 27H2:
      Po ogloszeniu przez Microsoft finalnego numeru builda GA dla Windows 11 27H2
      (wczesne buildy preview sa w zakresie 295xx-297xx), dopisz ponizej JEDNA linijke:
      <string>XXXXX</string>
      Wszystkie pliki YAML uzywaja warunkow builds: ['>=22000'] dla Windows 11
      oraz builds: ['<22000'] dla Windows 10, wiec zaden plik YAML nie wymaga zmian.
    -->
  </SupportedBuilds>
  <Requirements>
    <Requirement>DefenderToggled</Requirement>
    <Requirement>DefenderDisabled</Requirement>
    <Requirement>UCPDDisabled</Requirement>
    <Requirement>Internet</Requirement>
    <Requirement>NoAntivirus</Requirement>
    <Requirement>NoPendingUpdates</Requirement>
  </Requirements>
  <FeaturePages>
    <CheckboxPage Description="Wybierz dodatkowe aplikacje do zainstalowania (bez Microsoft Store i winget):" IsRequired="false">
      <TopLine Text="Wszystkie instalatory sa pobierane bezposrednio ze zrodel producentow." />
      <BottomLine Text="Aplikacje per-user (Discord, Spotify, Roblox) sa instalowane w kontekscie uzytkownika bez elevacji." />
      <Options>
        <CheckboxOption IsChecked="false">
          <Name>app-chrome</Name>
          <Text>Google Chrome (x64 Enterprise MSI)</Text>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Name>app-discord</Name>
          <Text>Discord (x64)</Text>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Name>app-spotify</Name>
          <Text>Spotify (Desktop)</Text>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Name>app-epic</Name>
          <Text>Epic Games Launcher (MSI)</Text>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Name>app-roblox</Name>
          <Text>Roblox Player</Text>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Name>app-tikstream</Name>
          <Text>TikStream (+ VC++ x64 &amp; .NET 10 Desktop Runtime)</Text>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
  </FeaturePages>
</Playbook>
